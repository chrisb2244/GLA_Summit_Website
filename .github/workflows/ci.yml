name: CI

# Lint + unit tests. These need no deployment and no database, so they run on
# every PR and on pushes to the long-lived branches. Make them required checks
# on `staging` and `master` (Settings → Branches).

on:
  pull_request:
  push:
    branches: [staging, master]

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  unit:
    runs-on: ubuntu-latest
    # Dummy public env so any module that reads it at import time does not crash.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run
