name: Keep test DB warm

# Supabase free projects auto-pause after ~7 days idle. A paused test DB at PR
# time = failed e2e checks. A cheap REST ping every 6h keeps it active.
# (Scheduled workflows run only from the default branch.)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping test Supabase REST endpoint
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "${{ vars.TEST_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ vars.TEST_SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          # 200/401/404 all prove the project is awake; only a network failure fails.
          if [ -z "$code" ] || [ "$code" = "000" ]; then
            echo "::error::no response from test Supabase"; exit 1
          fi
