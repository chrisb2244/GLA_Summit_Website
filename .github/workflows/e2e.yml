name: E2E (test DB)

# Heavy/provisioning Playwright suites. They must NOT run against the Vercel
# preview/prod URLs (those point at the production DB), so CI builds and serves
# the app itself with TEST-project env and runs Playwright against localhost.
#
# Email is mocked through a Mailpit service container (no external quota), so the
# full suite — including every email-bearing spec — runs on PRs to BOTH staging
# and master. The previous staging-only tag subset existed to cap testmail.app
# usage and is no longer needed.
#
# Make the `e2e` job a required check on `staging` and `master`.

on:
  pull_request:
    branches: [staging, master]

permissions:
  contents: read

# One shared test database → serialise so concurrent runs can't collide on
# deterministic seed data (e.g. ticket sequences). Queue rather than cancel.
concurrency:
  group: e2e-shared-test-db
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      # Build-time + runtime app env → the TEST Supabase project.
      # URL + publishable anon key are non-sensitive → repository variables.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.TEST_SUPABASE_ANON_KEY }}
      SECRET_SUPABASE_SERVICE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_KEY }}

      # Server-side secrets the exercised flows need.
      TICKET_KEY: ${{ secrets.CI_TICKET_KEY }}
      COPRESENTER_INVITE_KEY: ${{ secrets.CI_COPRESENTER_INVITE_KEY }}

      # Mock email: the app sends through nodemailer → the Mailpit service below
      # instead of Mailgun, and the specs read it back over Mailpit's HTTP API.
      USE_MOCK_EMAIL: 'true'
      MAILPIT_SMTP_URL: 'http://localhost:54325'
      MAILPIT_API_URL: 'http://localhost:54324'

      # Shared secret for the submission-outcome webhook. Consumed by BOTH the app
      # (authenticating POST /api/submission-outcome) and the outcome-email spec
      # (which posts the webhook and otherwise skips). Must equal the TEST project
      # DB's Vault `submission_outcome_token`.
      SECRET_SUBMISSION_OUTCOME_TOKEN: ${{ secrets.CI_SUBMISSION_OUTCOME_TOKEN }}

      # Used only as the From address on mock-sent mail (any value is fine here).
      EMAIL_FROM_MG: ${{ vars.EMAIL_FROM_MG }}

      # Concluder-test user
      TEST_CONCLUDER_EMAIL: ${{ vars.TEST_CONCLUDER_EMAIL }}
      TEST_CONCLUDER_FIRST_NAME: ${{ vars.TEST_CONCLUDER_FIRST_NAME }}
      TEST_CONCLUDER_LAST_NAME: ${{ vars.TEST_CONCLUDER_LAST_NAME }}
      TEST_CONCLUDER_USER_ID: ${{ vars.TEST_CONCLUDER_USER_ID }}
    # Mailpit catches every email the app sends during the run. Host 54324 maps to
    # its HTTP API (read) and 54325 to its SMTP listener (send), matching the
    # MAILPIT_API_URL / MAILPIT_SMTP_URL values above.
    services:
      mailpit:
        # Pinned to an immutable digest (not a mutable tag) so a re-pushed tag or
        # upstream account compromise can't silently change what runs in CI. The
        # human-readable tag is informational; Docker resolves by digest. Bump via
        # the Renovate/Dependabot config (see .github/) so patches arrive as PRs.
        image: axllent/mailpit:v1.30.2@sha256:37a38e48e9338cd7e89dfeb487f37b02ebfcd9cb23111bed2d345e79d37d6dd6
        ports:
          - 54324:8025
          - 54325:1025
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Cache Next build
        uses: actions/cache@v5
        with:
          path: frontend/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Build app (test DB)
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Wait for Mailpit
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:54324/api/v1/info >/dev/null 2>&1; then
              echo "mailpit ready"; exit 0
            fi
            sleep 1
          done
          echo "::error::mailpit did not become ready"; exit 1

      - name: Start app and wait for ready
        run: |
          # playwright.config.ts hard-requires .env.test to exist; an empty file
          # is valid (all real values come from the job env above, which dotenv
          # does not override).
          touch .env.test
          nohup npm start > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then
              echo "app ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::app did not become ready"; cat /tmp/app.log; exit 1

      - name: Run Playwright (full suite)
        # Email now runs against the local Mailpit service (no external quota), so
        # the old staging grep — which existed to cap testmail.app usage — is gone:
        # staging and master both run the full suite. The only remaining difference
        # would be runner time, and these checks don't gate deployment. Re-add a
        # `--grep` here if staging wall-time ever becomes a problem.
        # line → CI log; html → uploaded artifact (does not open a browser on CI).
        run: |
          echo "Target ${{ github.base_ref }} → full suite"
          npx playwright test --project firefox --reporter=line,html

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
