name: Synthetic (on deploy)

# Read-only @synthetic checks against the REAL Vercel deployment once it is
# ready. Fires for every successful deployment (feature preview, staging, and
# production). Safe even when the URL is prod-backed because the @synthetic
# specs provision nothing and only navigate/assert.
#
# NOTE: `deployment_status`-triggered workflows only run from the file on the
# default branch (master), so this takes effect once merged to master.

on:
  deployment_status:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  synthetic:
    if: ${{ github.event.deployment_status.state == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # playwright.config.ts reads `baseURL` (and VERCEL_URL) for the target.
      baseURL: ${{ github.event.deployment_status.target_url }}
      # @synthetic tests are read-only browser checks against the deployment URL
      # and never call the admin client. But Playwright imports the whole test
      # dir during collection, and some specs construct createSupabaseAdmin() at
      # describe scope — which throws if the key is absent. Provide the TEST
      # project's key (NOT prod's): it targets the test DB, so it cannot affect
      # production, and the synthetic tests never use it. Deliberately no
      # testmail/Mailgun — these checks must never send email.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.TEST_SUPABASE_ANON_KEY }}
      SECRET_SUPABASE_SERVICE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Run @synthetic against the deployment
        run: |
          touch .env.test
          echo "Target: $baseURL"
          npx playwright test --project firefox --reporter=line,html --grep @synthetic

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
