# Playwright e2e requires local Supabase (55321/55324), frontend/.env.test,
# and a running Next dev server. Run locally per frontend/AGENTS.md.
# This workflow is disabled until CI infrastructure matches that setup.

name: Playwright Tests

on:
  workflow_dispatch:

jobs:
  test:
    if: false
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps firefox
      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test --project firefox
